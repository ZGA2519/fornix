[project]
name = "context-store"
version = "0.1.0"
description = "Project memory shared across AI sessions and models: write / select / compress / isolate"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "mcp>=2.1.1",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
context = "context_store.server:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "context_store"
module-root = ""

[tool.uv]
default-groups = []  # consumers get no pytest, test with: uv run --group dev pytest

[dependency-groups]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
