[project]
name = "fornix"
version = "0.3.1"
description = "Project memory for AI coding sessions. Lives in the repo, travels with the code, shared by every model that opens it, consulted on every prompt."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/ZGA2519/fornix"

[project.scripts]
fornix = "setup:main"
context-system = "setup:main"  # the name before the rename, so old uvx lines still run

# flit_core: the one backend that ships a single-file module without ever executing
# setup.py (setuptools would run it at build time and start the wizard).
[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "setup"
