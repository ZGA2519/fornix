# Every push to main runs the tests; if they pass and pyproject's version is not on
# PyPI yet, it is published, once. A push that does not bump the version stops after
# the tests. The release tag is pushed before publishing: setup.py, when installed
# from PyPI, clones v<version> for .fornix/ and skills/.
#
# Auth is PyPI trusted publishing, no token stored anywhere. One-time setup on PyPI:
# project fornix → Manage → Publishing → GitHub: owner ZGA2519,
# repository fornix, workflow publish.yml, environment pypi.
#
# npm/ (the `npx fornix-cli` front, which runs uvx fornix@<its version>) goes out
# after, checked against npm on its own so it catches up on a version PyPI already has.
# Named fornix-cli because npm refuses plain "fornix" as too close to formik and for-in.
# Auth is npm trusted publishing. One-time: the first `npm publish ./npm` by hand, then
# npmjs.com → fornix-cli → Settings → Trusted publisher → GitHub Actions: ZGA2519/fornix,
# workflow publish.yml, environment pypi.
name: publish
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: installer
        run: python3 test_setup.py
      - name: store
        run: uv run --directory .fornix --group dev python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # push the release tag
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: version, and whether PyPI has it already
        id: v
        run: |
          v=$(uv version --short)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if curl -fs "https://pypi.org/pypi/fornix/$v/json" >/dev/null; then
            echo "$v is already on PyPI, nothing to publish"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: tag v${{ steps.v.outputs.version }}
        if: ${{ !steps.v.outputs.skip }}
        run: |
          t=v${{ steps.v.outputs.version }}
          if git ls-remote --exit-code origin "refs/tags/$t" >/dev/null; then
            echo "$t already exists on origin, keeping it"
          else
            git tag "$t" && git push origin "$t"
          fi

      - name: build and publish
        if: ${{ !steps.v.outputs.skip }}
        run: uv build && uv publish

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # npm >= 11.5.1 for trusted publishing
          registry-url: https://registry.npmjs.org

      - name: npm publish
        run: |
          v=${{ steps.v.outputs.version }}
          if npm view "fornix-cli@$v" version >/dev/null 2>&1; then
            echo "$v is already on npm, nothing to publish"
          else
            cp README.md LICENSE.txt npm/ && npm publish ./npm
          fi
